<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Management System</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="container">
        <h1>Employee Management System</h1>
        <p class="subtitle">CRUD Web Application</p>

        <div id="message"></div>

        <form id="employeeForm">
            <input type="hidden" id="employeeId">

            <div class="grid">
                <input id="name" type="text" placeholder="Employee Name" required>
                <input id="email" type="email" placeholder="Email" required>
                <input id="department" type="text" placeholder="Department" required>
                <input id="salary" type="number" min="0" step="0.01" placeholder="Salary" required>
                <input id="joiningDate" type="date" required>
            </div>

            <button type="submit" id="submitBtn">Add Employee</button>
            <button type="button" id="cancelBtn" class="secondary" hidden>Cancel Edit</button>
        </form>

        <input id="search" class="search" type="search" placeholder="Search by name, email or department...">

        <div class="table-wrap">
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Name</th>
                        <th>Email</th>
                        <th>Department</th>
                        <th>Salary</th>
                        <th>Joining Date</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="employeeTable"></tbody>
            </table>
        </div>
    </div>
    <script src="/static/script.js"></script>
</body>
</html>
